        start_date: 2024-05
        end_date: 2025-07
        summary: "Advisor: Dr. Surender Reddy Salkuti"
        highlights:
          - Built a spatio-temporal GNN with Topological Data Analysis features for solar-irradiance forecasting, achieving a 72.8% reduction in voltage violations in PV systems; fused graph convolutions with an ARIMA-based temporal model for predictive grid-stability control.
          - "[Certificate](https://drive.google.com/file/d/1qtGpnf0YC0_37KQ6pa3ZJ6ZPaOI-Og3G/view?usp=sharing)"

      - company: Indian Space Research Organisation (ISRO)
        position: Undergraduate Researcher
        location: India
        start_date: 2024-06
        end_date: 2025-05
        summary: "Advisor: Dr. Brahmjit Singh"
        highlights:
          - Simulated a 10,000-sample GNSS dataset to systematically validate Bi-LSTM architectures for identifying and classifying radio frequency jamming. Processed time-series data utilizing overlapping sliding windows for feature extraction, achieving >99% classification accuracy across dynamic 2dB to 20dB SNR environments.
          - "[Certificate](https://drive.google.com/file/d/1vSQktF2ZaqzXKW5EIGT0dcF83roMb_UG/view?usp=sharing)"

